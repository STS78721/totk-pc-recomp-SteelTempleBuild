# totk.ini: SteelTemple TotK PC Recompiled default configuration.
# Clean, maximum-performance baseline out of the box. Use TotKLauncher Settings or press F1 in-game
# to switch to Enhanced High / SteelTemple Ultra graphics, DLSS 4.5 / FSR 4 / XeSS, Frame Gen, or DualSense haptics.

[frame rate]
fps_limit = 240
fps60 = 1
frame_queue = 0
realtime = 1
cloth_realtime = 1
highfps_fix = 1
climb_fix = 1

[performance]
async_preempt = 1
replay_async = 0
replay_workers = 0
free_cores = 0
timer_1ms = 1
sync_ahead = 0
shadow_defer = 1
pipe_wait = default
pipe_skip = fullscreen
lib_prebuild = 1
pipe_prebuild = 1
gpl = 1
astc = auto
memory = auto
tex_alias = 1
tex_vram_pressure = 90
tex_released_mib = 256
tex_block_mib = 64
vma_block_mib = 64
zstd_native = 1
zstd_check = 0
lod_guard = 1
fix_c0 = 1
fix_zero = 1
bind_skip = 1
shader_memo = 1
pipe_memo = 1
tex_memo = 1
desc_template = 1
push_skip = 1
vb_used = 1
split_draws = 64
split_us = 1000
vk_validation = 0
vk_subgroup_pin = 1

[display]
device_profile = auto
vk_present = mailbox
window_size = 1920x1080
output_res = 1920x1080
fullscreen = 1
assume_focus = 1
perf_overlay = off
render_scale = game
dynamic_res = 0
upscaler = fsr
upscaler_preset = native
dlss = dlaa
dlaa = 0
dlss_preset = default
dlss_char_mask = 65
dlss_nr = 0
dlss_nr_preset = preset_b
dlss_nr_passes = 1
dlss_nr_model = transformer_gen3
dlss_nr_ray_cache = realtime
dlss_nr_scale = auto
dlss_nr_color = 0.0
dlss_nr_transfer = auto
dlss_nr_sharpness = 80
sharpness = 80
fg_mode = off
fg_preset = preset_a
fg_mult = 2x
reflex = on
antilag2 = on
xell = off
xess_quality = quality
fxaa = 1
aspect = fit
movie_aspect = keep
fov = 100
aniso = 16
color_preset = default
color_brightness = 0
color_contrast = 100
color_saturation = 100
color_gamma = 1
hdr = 0
hdr_peak_nits = 1000
hdr_game_nits = 203
hdr_ui_nits = 203
hdr_hue = 80
shadow_res = game
shadow_scale = 1
shadow_range = 100
grass_range = 100
ao_mode = native
contact_shadows = 0
pcss = 0

[language]
operation_mode = docked

[discord]
discord_rpc = 0
discord_app_id = 1567232599846293504
discord_image = totk_512x512

[audio]
volume = 100
audio_channels = auto

[input]
motion = 1
rumble_strength = 130
rumble_curve = 0.6
rumble_triggers = 0
dualsense = 0
dualsense_triggers = 1
dualsense_trigger_strength = 100
dualsense_audio = 1
dualsense_vol = 100
dualsense_audio_mode = interactive
dualsense_haptics = 1
pad_layout = auto
prompts = nintendo
stick_deadzone = 8
stick_sens = 1
mouse_mode = direct
mouse_sens = 1
mouse_aim_scale = 1
menu_cursor = 1
map_click = 1
dialogue_click = 1
walk_key = lshift
walk_scale = 0.51

[mods]
mods_rebuild = auto
tex_heap_extra_mb = 0
